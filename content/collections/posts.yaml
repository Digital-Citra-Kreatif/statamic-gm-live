title: Posts
icon: collections
template: posts/show
layout: layout
taxonomies:
  - categories
  - social_media
revisions: false
route: '/berita-dan-artikel/{slug}'
date: true
sort_dir: desc
default_status: draft
date_behavior:
  past: public
  future: private
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
inject:
  seo:
    title: '@seo:title'
    description: '@seo:excerpt'
    image: '@seo:featured_image'
structure:
  root: false
