title: 'Career Label Information'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Single - Information Label'
        fields:
          -
            handle: requirements_label
            field:
              type: text
              display: 'Requirements Label'
              instructions: 'Label bagian persyaratan.'
              validate:
                - required
          -
            handle: label_jobdesc
            field:
              type: text
              display: 'Label Jobdesc'
              instructions: 'Label bagian deskripsi pekerjaan.'
              validate:
                - required
          -
            handle: label_submit_button
            field:
              type: text
              display: 'Label Submit Button'
              instructions: 'Teks tombol lamar.'
              validate:
                - required
          -
            handle: icon_employment_status
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon Employment Status'
              instructions: 'Ikon status pekerjaan. Icon 20x20px.'
              validate:
                - required
          -
            handle: icon_location
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon Location'
              instructions: 'Ikon lokasi. Icon 20x20px.'
              validate:
                - required
      -
        display: 'Single - Call to Action'
        fields:
          -
            import: common.identifier
          -
            import: blocks.cta_grid
          -
            import: common.section_settings
          -
            handle: background_call_to_action
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Background Call to Action'
              instructions: 'Gambar latar bagian ajakan bertindak. Image 1280x600px.'
              validate:
                - required
          -
            handle: section_images
            field:
              container: assets
              type: assets
              display: 'Contact Icon Placeholder'
              max_files: 1
              validate:
                - required
              instructions: 'Icon kontak cadangan. Ukuran file 200x200px; ukuran tampil 20x20px.'
      -
        display: 'Skin - Label'
        fields:
          -
            handle: button_label
            field:
              type: text
              display: 'Button Label'
              instructions: 'Teks tombol pada kartu lowongan.'
      -
        display: 'Form Popup'
        fields:
          -
            handle: form_heading
            field:
              type: text
              display: 'Form Heading'
              instructions: 'Judul formulir lamaran.'
          -
            handle: form_description
            field:
              type: textarea
              display: 'Form Description'
              instructions: 'Deskripsi singkat formulir.'
          -
            handle: button_submit_label
            field:
              type: text
              display: 'Button Submit Label'
              instructions: 'Teks tombol kirim.'
              validate:
                - required
          -
            handle: label_input_file
            field:
              type: text
              display: 'Label Input File'
              instructions: 'Label unggah berkas.'
              width: 50
              validate:
                - required
          -
            handle: label_button_input_file
            field:
              type: text
              display: 'Label Button Input File'
              instructions: 'Teks tombol pilih berkas.'
              width: 50
              validate:
                - required
          -
            handle: success_message
            field:
              container: assets
              remove_empty_nodes: false
              type: bard
              display: 'Success message'
              instructions: 'Pesan saat lamaran berhasil dikirim.'
              validate:
                - required
              buttons:
                - bold
                - italic
                - removeformat
                - quote
                - anchor
          -
            handle: message_failed
            field:
              container: assets
              remove_empty_nodes: false
              type: bard
              display: 'Message failed'
              instructions: 'Pesan saat lamaran gagal dikirim.'
              validate:
                - required
              buttons:
                - bold
                - italic
                - removeformat
                - quote
                - anchor
      -
        display: Archive
        fields:
          -
            handle: sort_order_by
            field:
              options:
                -
                  key: tanggal_upload
                  value: 'Tanggal Upload'
                -
                  key: urutan_tree
                  value: 'Urutan Tree (Statamic)'
                -
                  key: judul_az
                  value: 'Judul A-Z'
                -
                  key: judul_za
                  value: 'Judul Z-A'
              type: select
              display: 'Sort Order By'
              instructions: 'Urutan tampil lowongan.'
              validate:
                - required
