title: 'Single Career Information'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Information Label'
        instructions: 'change the label on the single career page.'
        fields:
          -
            handle: requirements_label
            field:
              type: text
              display: 'Requirements Label'
              instructions: 'Label bagian persyaratan.'
              validate:
                - required
          -
            handle: label_jobdesc
            field:
              type: text
              display: 'Label Jobdesc'
              instructions: 'Label bagian deskripsi pekerjaan.'
              validate:
                - required
          -
            handle: label_submit_button
            field:
              type: text
              display: 'Label Submit Button'
              instructions: 'Teks tombol lamar.'
              validate:
                - required
          -
            handle: icon_employment_status
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon Employment Status'
              instructions: 'Ikon status pekerjaan. Icon 20x20px.'
              validate:
                - required
          -
            handle: icon_location
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon Location'
              instructions: 'Ikon lokasi. Icon 20x20px.'
              validate:
                - required
      -
        display: 'Call to Action'
        fields:
          -
            import: common.identifier
          -
            handle: background_images
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Background Images'
              instructions: 'Gambar latar bagian ajakan bertindak. Image 1280x600px.'
              validate:
                - required
          -
            import: blocks.cta_grid
          -
            import: common.section_settings
          -
            handle: section_images
            field:
              container: assets
              type: assets
              display: 'Contact Icon Placeholder'
              max_files: 1
              validate:
                - required
              instructions: 'Icon kontak cadangan. Ukuran file 200x200px; ukuran tampil 20x20px.'
