title: 'Primary Footer'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: image
            field:
              container: assets
              max_files: 1
              min_files: 1
              type: assets
              display: Image
              instructions: 'Gambar utama footer. Image maksimal 640x600px.'
              validate:
                - required
          -
            handle: heading
            field:
              type: text
              display: Heading
              instructions: 'Judul footer.'
              validate:
                - required
          -
            handle: short_description
            field:
              type: textarea
              display: 'Short Description'
              instructions: 'Deskripsi singkat footer.'
          -
            handle: backgound_image
            field:
              container: assets
              max_files: 1
              min_files: 1
              type: assets
              display: 'Backgound Image'
              instructions: 'Silakan unggah gambar dengan overlay berwarna. Image 1440x480px.'
              validate:
                - required
          -
            handle: label_button
            field:
              type: text
              display: 'Label Button'
              instructions: 'default: Konsultasi Sekarang'
              validate:
                - required
          -
            handle: url_button
            field:
              type: link
              display: 'URL Button'
              instructions: 'None: menonaktifkan button | URL: untuk external link | Entry: mengarahkan user ke halaman website.'
          -
            handle: show
            field:
              type: toggle
              display: Show
              instructions: 'Tampilkan footer.'
      -
        display: 'Other Information'
        fields:
          -
            handle: label_social_media
            field:
              default: 'Media Sosial'
              type: text
              display: 'Label Social Media (Mobile)'
              instructions: 'Label media sosial di tampilan mobile.'
              validate:
                - required
