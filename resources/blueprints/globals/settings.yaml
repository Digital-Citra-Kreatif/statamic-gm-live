title: Settings
tabs:
  branding:
    display: Branding
    sections:
      -
        fields:
          -
            handle: site_title
            field:
              type: text
              display: 'Site title'
              instructions: 'Nama situs.'
              localizable: true
              validate:
                - required
          -
            handle: site_logo
            field:
              type: assets
              display: 'Site logo'
              instructions: 'Logo situs. Image maksimal 128x64px.'
              container: assets
              max_files: 1
              localizable: true
              validate:
                - required
          -
            handle: favicon
            field:
              container: assets
              max_files: 1
              type: assets
              display: Favicon
              instructions: 'Ikon kecil di tab browser. Image 32x32px.'
              validate:
                - required
  social:
    display: 'Social media'
    sections:
      -
        fields:
          -
            handle: social_media
            field:
              type: group
              display: 'Social media'
              instructions: 'Tautan akun media sosial.'
              localizable: true
              fields:
                -
                  handle: instagram
                  field:
                    type: group
                    display: Instagram
                    instructions: 'Akun Instagram.'
                    fields:
                      -
                        import: common.social_platform
                -
                  handle: facebook
                  field:
                    type: group
                    display: Facebook
                    instructions: 'Akun Facebook.'
                    fields:
                      -
                        import: common.social_platform
                -
                  handle: linkedin
                  field:
                    type: group
                    display: LinkedIn
                    instructions: 'Akun LinkedIn.'
                    fields:
                      -
                        import: common.social_platform
  contact:
    display: Contact
    sections:
      -
        fields:
          -
            handle: phone_numbers
            field:
              type: replicator
              display: 'Phone numbers'
              instructions: 'Daftar nomor telepon.'
              localizable: true
              collapse: true
              sets:
                phone:
                  display: 'Phone number'
                  fields:
                    -
                      import: common.contact_phone
          -
            handle: emails
            field:
              type: replicator
              display: Emails
              instructions: 'Daftar alamat email.'
              localizable: true
              collapse: true
              sets:
                email:
                  display: Email
                  fields:
                    -
                      import: common.contact_email
          -
            handle: address
            field:
              type: textarea
              display: Address
              instructions: 'Alamat kantor.'
              localizable: true
          -
            handle: google_map_link
            field:
              type: text
              display: 'Google Maps link'
              instructions: 'Tautan Google Maps.'
              input_type: url
              localizable: true
              validate: nullable|url
  general_settings:
    display: 'General Settings'
    sections:
      -
        display: 'Custom Code'
        fields:
          -
            handle: custom_code_head
            field:
              mode_selectable: false
              show_mode_label: false
              type: code
              display: 'Custom Code Head'
              instructions: 'Kode tambahan di bagian head.'
          -
            handle: custom_code_body
            field:
              mode_selectable: false
              show_mode_label: false
              type: code
              display: 'Custom Code Body'
              instructions: 'Kode tambahan sebelum penutup body.'
          -
            handle: google_analytics_measurement_id
            field:
              placeholder: G-XXXXXXXXXX
              type: text
              display: 'Google Analytics - Measurement ID'
              instructions: 'ID pengukuran Google Analytics.'
      -
        display: 'Sticky Header'
        fields:
          -
            handle: header_desktop
            field:
              type: toggle
              display: 'Header Desktop'
              instructions: 'Header menempel saat scroll di desktop.'
              width: 50
          -
            handle: header_mobile
            field:
              type: toggle
              display: 'Header Mobile'
              instructions: 'Header menempel saat scroll di mobile.'
              width: 50
          -
            handle: show_scroll_top
            field:
              default: true
              type: toggle
              display: 'Show Scroll Top'
              instructions: 'Tampilkan tombol kembali ke atas.'
          -
            handle: scroll_top_position
            field:
              options:
                -
                  key: left
                  value: Left
                -
                  key: right
                  value: Right
              type: select
              display: 'Scroll Top Position'
              instructions: 'Posisi tombol kembali ke atas.'
      -
        display: Translate
        fields:
          -
            handle: translate_label
            field:
              type: text
              display: 'Translate Label'
              instructions: 'Label menu terjemahan.'
          -
            handle: embed_translate
            field:
              mode: javascript
              mode_selectable: false
              show_mode_label: false
              type: code
              display: 'Embed Translate'
              instructions: 'Skrip embed penerjemah.'
  floating_whatsapp:
    display: 'Floating WhatsApp'
    sections:
      -
        display: 'Floating WhatsApp'
        fields:
          -
            handle: icon
            field:
              container: assets
              max_files: 1
              type: assets
              display: Icon
              instructions: 'Ikon tombol WhatsApp. Icon 30x30px.'
          -
            handle: label_floating
            field:
              type: text
              display: 'Label Floating'
              instructions: 'Teks pada tombol mengambang.'
          -
            handle: heading
            field:
              type: text
              display: Heading
              instructions: 'Judul popup WhatsApp.'
          -
            handle: short_description
            field:
              type: textarea
              display: 'Short Description'
              instructions: 'Deskripsi singkat popup WhatsApp.'
          -
            handle: position
            field:
              options:
                -
                  key: left
                  value: Left
                -
                  key: right
                  value: Right
              type: select
              display: Position
              instructions: 'Posisi tombol WhatsApp.'
          -
            handle: show_button
            field:
              default: true
              type: toggle
              display: 'Show Button'
              instructions: 'Tampilkan tombol WhatsApp.'
      -
        display: 'Contact WhatsApp'
        fields:
          -
            handle: contact_whatsapp
            field:
              type: grid
              display: 'Contact WhatsApp'
              instructions: 'Daftar kontak WhatsApp.'
              mode: stacked
              fields:
                -
                  handle: avatar
                  field:
                    container: assets
                    max_files: 1
                    type: assets
                    display: Avatar
                    instructions: 'Foto kontak. Ukuran file 200x200px; ukuran tampil 42x42px.'
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    instructions: 'Nama kontak.'
                    width: 50
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    instructions: 'Jabatan atau keterangan kontak.'
                    width: 50
                -
                  handle: nomor_whatsapp
                  field:
                    type: float
                    display: 'Nomor WhatsApp'
                    instructions: 'Nomor WhatsApp diawali 62.'
                -
                  handle: message
                  field:
                    type: textarea
                    display: Message
                    instructions: 'Pesan otomatis saat chat dibuka.'
