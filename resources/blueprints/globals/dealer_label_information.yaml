title: 'Dealer Label Information'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: peta_label
            field:
              default: Peta
              type: text
              display: 'Peta Label'
              instructions: 'Label mode tampilan peta.'
              width: 33
              validate:
                - required
          -
            handle: satelit_label
            field:
              default: Satelit
              type: text
              display: 'Satelit Label'
              instructions: 'Label mode tampilan satelit.'
              width: 33
              validate:
                - required
          -
            handle: placeholder_search
            field:
              default: 'Ketik Kota'
              type: text
              display: 'Placeholder Search'
              instructions: 'Teks bantuan pada kolom pencarian.'
              width: 33
          -
            handle: empty_search_label
            field:
              default: 'Dealer tidak ditemukan. Coba kata kunci atau filter lain.'
              type: text
              display: 'Empty Search Feedback'
              instructions: 'Pesan saat dealer tidak ditemukan.'
          -
            handle: icon_maps_dealer
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon Maps Dealer'
              instructions: 'Ikon penanda dealer di peta. Icon 40x40px.'
              validate:
                - required
          -
            handle: icon_phone_dealer
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon Phone Dealer'
              instructions: 'Ikon telepon dealer. Icon 20x20px.'
          -
            handle: icon_whatsapp_dealer
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Icon WhatsApp Dealer'
              instructions: 'Ikon WhatsApp dealer. Icon 20x20px.'
