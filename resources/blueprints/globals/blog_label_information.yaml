title: 'Blog Label Information'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Archive & Single Blog'
        fields:
          -
            handle: category_labels
            field:
              type: text
              display: 'Category Labels'
              instructions: 'Label kategori berita.'
              validate:
                - required
          -
            handle: latest_blog_label
            field:
              type: text
              display: 'Latest Blog Label'
              instructions: 'Label berita terbaru.'
              validate:
                - required
          -
            handle: label_share
            field:
              type: text
              display: 'Label Share'
              instructions: 'Label tombol bagikan.'
              validate:
                - required
          -
            handle: related_news_labels
            field:
              type: text
              display: 'Related News Labels'
              instructions: 'Label berita terkait.'
              validate:
                - required
          -
            handle: label_button
            field:
              type: text
              display: 'Label Button'
              instructions: 'Teks tombol baca selengkapnya.'
              validate:
                - required
          -
            handle: sort_order_by
            field:
              options:
                -
                  key: tanggal_upload
                  value: 'Tanggal Upload'
                -
                  key: urutan_tree
                  value: 'Urutan Tree (Statamic)'
                -
                  key: judul_az
                  value: 'Judul A-Z'
                -
                  key: judul_za
                  value: 'Judul Z-A'
              type: select
              display: 'Sort Order By'
              instructions: 'Urutan tampil berita.'
              validate:
                - required
      -
        display: 'Loop Blog'
        fields:
          -
            handle: image_placeholders
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Image Placeholders'
              instructions: 'Gambar cadangan bila berita tanpa gambar. Image 400x250px.'
              validate:
                - required
      -
        display: 'Share Button'
        fields:
          -
            handle: social_share
            field:
              fullscreen: false
              max_rows: 5
              min_rows: 5
              type: grid
              display: 'Social Share'
              instructions: 'Ikon media sosial untuk berbagi.'
              fields:
                -
                  handle: icon
                  field:
                    container: assets
                    type: assets
                    display: Icon
                    instructions: 'Ikon media sosial. Icon 20x20px.'
                    width: 50
                    validate:
                      - required
                    max_files: 1
                -
                  handle: show
                  field:
                    default: true
                    type: toggle
                    display: Show
                    instructions: 'Tampilkan ikon ini.'
                    width: 50
