title: Category
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              localizable: true
              instructions: 'Judul konten.'
              validate:
                - required
          -
            handle: hero_banner_image
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Hero banner image'
              instructions: 'Gambar banner (opsional). Image 1440x500px.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: 'URL Halaman'
              required: true
              instructions: 'URL otomatis dari judul.'
              validate:
                - required
                - 'max:200'
              localizable: true
          -
            handle: parent
            field:
              type: terms
              taxonomies:
                - categories
              max_items: 1
              display: 'Parent Category'
              localizable: true
              instructions: 'Kategori induk (opsional).'
  'SEO Meta':
    display: 'SEO Meta'
    sections:
      -
        fields:
          -
            handle: seo
            field:
              type: seo_pro
              listable: false
              display: SEO
  'SEO Previews':
    display: 'SEO Previews'
    sections:
      -
        fields:
          -
            handle: seo_previews
            field:
              type: seo_pro_previews
              listable: false
              display: 'SEO Previews'
              localizable: false
              hide_display: true
              unless:
                seo.enabled: 'equals false'
