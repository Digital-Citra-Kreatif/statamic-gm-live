title: 'Dealer Category'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              localizable: true
              width: 50
              instructions: 'Judul konten.'
              validate:
                - required
          -
            handle: order
            field:
              type: integer
              display: Order
              width: 50
              instructions: 'Urutan tampilan.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: 'URL Halaman'
              required: true
              instructions: 'URL otomatis dari judul.'
              validate:
                - required
                - 'max:200'
              localizable: true
  'SEO Meta':
    display: 'SEO Meta'
    sections:
      -
        fields:
          -
            handle: seo
            field:
              type: seo_pro
              listable: false
              display: SEO
  'SEO Previews':
    display: 'SEO Previews'
    sections:
      -
        fields:
          -
            handle: seo_previews
            field:
              type: seo_pro_previews
              listable: false
              display: 'SEO Previews'
              localizable: false
              hide_display: true
              unless:
                seo.enabled: 'equals false'
