title: Team profile (primary)
fields:
- import: common.identifier
- handle: image
  field:
    type: assets
    display: Photo
    container: assets
    max_files: 1
    validate: required
    instructions: 'Foto utama. Image maksimal 600x600px.'
- handle: name
  field:
    type: text
    display: Name
    validate: required
    instructions: Nama.
- handle: role
  field:
    type: text
    display: Role / title
    validate: required
    instructions: Jabatan atau peran.
- handle: bio
  field:
    type: bard
    display: Biography
    buttons:
    - bold
    - italic
    - unorderedlist
    - orderedlist
    - removeformat
    instructions: Biografi.
- import: common.section_settings
