title: Team grid
fields:
- import: common.identifier
- handle: heading
  field:
    type: text
    display: Heading
    instructions: Judul bagian.
- handle: members
  field:
    type: grid
    display: Team members
    mode: stacked
    add_row: Add member
    validate: required
    fields:
    - handle: image
      field:
        type: assets
        display: Photo
        container: assets
        max_files: 1
        validate: required
        instructions: 'Foto anggota. Image maksimal 400x500px.'
    - handle: name
      field:
        type: text
        display: Name
        validate: required
        instructions: Nama.
    - handle: role
      field:
        type: text
        display: Role / title
        validate: required
        instructions: Jabatan atau peran.
    instructions: Anggota tim.
- import: common.section_settings
