title: Image & Label
fields:
- handle: gallery_images
  field:
    type: grid
    display: Gallery Images
    mode: stacked
    fields:
    - handle: images
      field:
        container: assets
        max_files: 1
        type: assets
        display: Images
        validate:
        - required
        instructions: 'Gambar/logo. Ukuran tampil: tinggi maksimal 100px; lebar menyesuaikan proporsi dan area kartu.'
    - handle: label
      field:
        type: text
        display: Label
        width: 50
        validate:
        - required
        instructions: Teks label.
    - handle: url_button
      field:
        type: link
        display: URL Button
        width: 50
        instructions: Tautan tombol.
    instructions: Galeri gambar.
