title: Vision Mission
fields:
- import: common.identifier
- handle: photo
  field:
    container: assets
    max_files: 1
    type: assets
    display: Photo
    instructions: 'Foto. Image maksimal 900x800px.'
- handle: content
  field:
    type: grid
    display: Content
    fields:
    - handle: title
      field:
        type: text
        display: Title
        instructions: Judul konten.
    - handle: description
      field:
        container: assets
        remove_empty_nodes: false
        type: bard
        display: Description
        instructions: Deskripsi.
    instructions: Isi konten.
- handle: photo_background
  field:
    container: assets
    max_files: 1
    type: assets
    display: Photo Background
    instructions: 'Latar foto. Image 1280x800px.'
- import: common.section_settings
