title: Contact banner
fields:
- handle: background_image
  field:
    type: assets
    display: Background image
    container: assets
    max_files: 1
    instructions: 'Gambar latar. Image 1440x400px.'
- handle: side_image
  field:
    type: assets
    display: Side image
    container: assets
    max_files: 1
    instructions: 'Gambar samping. Image maksimal 200x200px.'
- handle: heading
  field:
    type: text
    display: Heading
    validate: required
    instructions: Judul bagian.
- handle: text
  field:
    type: textarea
    display: Text
    instructions: Teks konten.
- handle: contact_label
  field:
    type: text
    display: Contact label
    default: Call & WA Center
    instructions: Label kontak.
- handle: phone
  field:
    type: text
    display: Phone number
    instructions: Nomor telepon.
- handle: whatsapp_link
  field:
    type: link
    display: WhatsApp link
    instructions: Link WhatsApp.
- handle: button
  field:
    type: group
    display: Button
    fields:
    - import: common.button
    instructions: Tombol aksi.
- handle: social_links
  field:
    type: grid
    display: Social links
    mode: stacked
    add_row: Add link
    fields:
    - import: common.social_link
- handle: visual_image
  field:
    type: assets
    display: Product / app visual
    container: assets
    max_files: 1
    instructions: 'Gambar visual. Image maksimal 300x300px.'
