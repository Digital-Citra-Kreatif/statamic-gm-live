title: Slider Hero Banner
fields:
- handle: slider_banner
  field:
    mode: stacked
    type: grid
    display: Slider Banner
    fields:
    - handle: heading
      field:
        type: text
        display: Heading
        validate:
        - required
        instructions: Judul bagian.
    - handle: short_description
      field:
        type: textarea
        display: Short Description
        instructions: Deskripsi singkat.
    - handle: label_button
      field:
        type: text
        display: Label Button
        validate:
        - required
        instructions: Teks tombol.
    - handle: url_button
      field:
        collections:
        - pages
        - careers
        - posts
        - products
        type: link
        display: URL Button
        validate:
        - required
        instructions: Tautan tombol.
    - handle: backgound_image
      field:
        container: assets
        max_files: 1
        type: assets
        display: Backgound Image
        instructions: 'Gambar latar slide. Image 1440x900px.'
    - handle: backgound_video
      field:
        type: video
        display: Backgound Video
        instructions: Video latar slide.
    instructions: Daftar slide banner.
- import: common.section_settings
